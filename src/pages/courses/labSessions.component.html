<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Sidebar Menu</title>
        <!-- Linking Google Font link for icons-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <link rel="stylesheet" href="labSessions.component.scss">
    </head>
    <body>
      <h2 style="text-align: center; margin-bottom: 10px;" *ngIf="labGroupId">Lab Sessions ({{ labGroupId }})</h2>
        <ul class="links">
            <li *ngFor="let labSession of labSessions">
                <div class="permissions-container">
                  <a (click)="navigateToLabSessionDetails(labSession)"><span class="title">{{ labSession.date | date: 'dd/MM/yyyy'}} <br> {{ labSession.startTime | customTimePipe }} - {{ labSession.endTime | customTimePipe }}</span></a>
    
                  <!--<label class="container" *ngFor="let course of semesterCourses">
                    {{ action }}
                  </label>-->
    
                </div>
        </ul>           
    </body>
</html>
