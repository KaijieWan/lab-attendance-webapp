<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Sidebar Menu</title>
        <!-- Linking Google Font link for icons-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <link rel="stylesheet" href="newSemDialog.component.scss">
    </head>
    <body>
        <div mat-dialog-title>
          <div class="slider-container">
            <button
              [class.active]="currentView === 'addRole'"
              (click)="switchView('addRole')">
              Add New Semseter
            </button>
            <!--<button
              [class.active]="currentView === 'updateRole'"
              (click)="switchView('updateRole')">
              Update Semester
            </button>-->
            <!--<div class="slider" [class.add-role]="currentView === 'addRole'" [class.update-role]="currentView === 'updateRole'"></div>-->
          </div>
        </div>
  
          <div mat-dialog-content>
            <div *ngIf="currentView === 'addRole'">
              <form [formGroup]="newSemesterForm">
                <div class="role-container">
                  <label for="annualYear">
                    Annual Year:
                    <span> AY </span>
                    <input type="text" formControlName="annnualYear_1" name="annualYear_1" class="annualYear_input" />
                    <span>/</span>
                    <input type="text" formControlName="annnualYear_2" name="annualYear_2" class="annualYear_input"/>
                  </label>
                  <label for="semester" class="semesterNo">
                    Semester:
                    <input type="radio" id="one" formControlName="semester" name="semester" value="1">
                    <label for="one">1</label><br>
                    <input type="radio" id="two" formControlName="semester" name="semester" value="2">
                    <label for="two">2</label><br>
                  </label>
                  
                  
                  <label for="week1StartDate">
                    Week 1 Start Date:
                    <mat-form-field appearance="outline">
                      <mat-label>Choose a date</mat-label>
                      <input matInput [matDatepicker]="picker" formControlName="week1StartDate" name="week1StartDate"/>
                      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                      <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                  </label>

                  <label >Upload Lab Schedule: <input type='file' (change)="uploadLabFile($event)"></label>
                  
                  
                  <label>Upload Student Files: <input type='file' (change)="uploadStudentFiles($event)" multiple></label>
                  <div>
                    <h4 style="margin-bottom: -5%; color: #3498db;">Uploaded Student Files:</h4>
                    <ul>
                      <li *ngFor="let file of displayFiles">
                        {{ file.name }} ({{ file.size }} bytes)
                      </li>
                    </ul>
                  </div>

                </div>                      
                
              </form>
            </div>
  
            <div *ngIf="currentView === 'updateRole'">
              <form [formGroup]="updateRoleForm">
                <div class="dropdown">
                  <label for="role">Role:</label>
                  <select type="text" id="role" name="role" [(ngModel)]="selectedRole" formControlName="update_role"
                    (change)="onRoleChange($event)">
                    <option value="" disabled style="background-color: gray">Select available role</option>
                    <option *ngFor="let item of distinctRoles" [value]="item">{{ item }}</option>
                  </select>
                </div>
  
                <h3 style="margin-bottom: -5px; color: blueviolet; align-self: center;">Permissions of the role:</h3>
                <ul class="links">
                  <li *ngFor="let page of pages">
                    <div class="permissions-container">
                      <span class="title">{{ page.title }}</span>
  
                      <label class="container" *ngFor="let action of pages_actions">
                        {{ action }}
                        <input type="checkbox" [formControlName]="getControlName(page.title, action)"
                        [checked]="isChecked(page.title, action)">
                        <span class="checkmark"></span>
                      </label>
        
                    </div>           
                    
                    <li *ngFor="let function of functions">
                      <div class="permissions-container">
                        <span class="title">{{ function.title }}</span>
    
                        <label class="container" *ngFor="let action of functions_actions">
                          {{ action }}
                          <input type="checkbox" [formControlName]="getControlName(function.title, action)"
                          [checked]="isChecked(function.title, action)">
                          <span class="checkmark"></span>
                        </label>      
                      </div>           
                  </li>
                </ul>                             
              </form>            
            </div>
          </div>
  
          <div mat-dialog-actions class="item" *ngIf="currentView === 'addRole'">
            <!--<span *ngIf="errorMessage" class="error-message">
              {{ errorMessage }}
            </span>-->
            <div class="button-container">
              <button type="button" mat-dialog-close>Cancel</button>
              <button type="button" (click)="newSemesterForm.valid && createSemester()" [disabled]="!newSemesterForm.valid">
                <span *ngIf="!submit">Add Semester</span>
                <span *ngIf="submit">
                Adding...</span>
              </button>
            </div>
          </div>
  
          <div mat-dialog-actions class="item" *ngIf="currentView === 'updateRole'">
            <div class="button-container">
              <button type="button" mat-dialog-close>Cancel</button>
              <button type="button" (click)="updateRoleForm.valid && updateRole()" [disabled]="!updateRoleForm.valid">
                <span *ngIf="!submit">Update Role</span>
                <span *ngIf="submit">
                Updating...</span>
              </button>
            </div>          
          </div>
          
      </body>
  </html>
