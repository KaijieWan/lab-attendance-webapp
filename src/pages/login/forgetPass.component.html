<div class="navbar">
    <div class="navbar-brand">
        <img src="assets/ntu_logo.png" alt="NTU Logo" style="width:280px;height:128px;" /> 
        <h1> 
            NTU Student Lab Attendance Portal
        </h1>
    </div>
    <div class="navbar-links">  
        <p style="margin-top:-30%" >
            Academic Year: 
            <span name="academicYear">{{ getCurrentAcadYear() }}</span>
        </p>
        <p style="margin-top:-4%">
            Date:
            <span name="currentDate">{{ date | date: 'dd/MM/yyyy, h:mm a'}}</span>
        </p>
        <!-- Add other relevant information -->
    </div>
</div>

<div class="input-container">
    <form [formGroup]="profileForm" class="form">
        <p>
            <span class="forgetPass_title">
                <u>Forget Password</u>
            </span>
            A link will be sent to your email to reset your password
            <label for="email">
              Enter Email:
              <input type="email" formControlName="email" name="email" />
            </label>
            <span>
                <div class="item">
                  <button type="button" (click)="emailCheck()" class="collapsible" [disabled]="sending">
                    <span *ngIf="!sending">Send Link</span>
                    <span *ngIf="sending">
                      Sending...</span>
                  </button>
                </div>
            </span>
            <span *ngIf="successMessage" class="success-message">
                {{ successMessage }}
            </span>
            <span *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </span>
        </p>
    </form>
</div>
