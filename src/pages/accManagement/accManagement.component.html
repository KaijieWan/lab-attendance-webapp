
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Sidebar Menu</title>
        <!-- Linking Google Font link for icons-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <link rel="stylesheet" href="accManagement.component.scss">
    </head>
    <body>
        <div>
            <h2 style="text-align: center; margin-bottom: 10px;">Accounts Management</h2>
            <div class="popup-box">
                <div class="new_settings">
                  <button mat-raised-button (click)="openNewRoleDialog()"> 
                    <span class="material-symbols-outlined">
                      engineering </span>
                    Role Management</button>
                  <button mat-raised-button (click)="openCreateUserDialog()"> 
                    <span class="material-symbols-outlined">
                      person_add </span>
                    Create New User </button>
                </div>
                <div class="user-list">
                    <table>
                      <thead>
                        <tr>
                          <th>Username</th>
                          <th>Name</th>
                          <th>Email</th>
                          <th>Role</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr *ngFor="let user of users">
                          <td>{{ user.username }}</td>
                          <td>{{ user.name }}</td>
                          <td>{{ user.email }}</td>
                          <td>{{ user.role }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  
                  <div class="pagination">
                    <button
                      [disabled]="currentPage === 0"
                      (click)="onPageChange(currentPage - 1)"
                    >
                      Previous
                    </button>
                  
                    <span>Page {{ currentPage + 1 }} of {{ totalPages }}</span>
                  
                    <button
                      [disabled]="currentPage + 1 >= totalPages"
                      (click)="onPageChange(currentPage + 1)"
                    >
                      Next
                    </button>
                  </div>
                  
            </div>
        </div>
        
    </body>
</html>
